<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1931"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1A14"/>
      <stop offset="1" stop-color="#1A0F0B"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E6FD9"/>
      <stop offset="1" stop-color="#0A1931"/>
    </linearGradient>
    <clipPath id="circ"><circle cx="160" cy="160" r="150"/></clipPath>
    <style>
      .blink{animation:blink 4s infinite;transform-origin:center 150px;transform-box:fill-box}
      @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
      .f1{animation:float 3s ease-in-out infinite}
      .f2{animation:float 3s ease-in-out infinite 1s}
      .f3{animation:float 3s ease-in-out infinite 2s}
      @keyframes float{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(-8px);opacity:.5}}
      .glow{animation:glow 2s ease-in-out infinite}
      @keyframes glow{0%,100%{opacity:1}50%{opacity:.6}}
    </style>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#bg)"/>
  <circle cx="160" cy="160" r="150" fill="none" stroke="#4FC3F7" stroke-width="3" opacity=".6"/>

  <g clip-path="url(#circ)">
    <!-- símbolos flutuando -->
    <text class="f1" x="40" y="95" font-family="monospace" font-size="22" fill="#4FC3F7">&lt;/&gt;</text>
    <text class="f2" x="238" y="80" font-family="monospace" font-size="22" fill="#4FC3F7">{ }</text>
    <text class="f3" x="250" y="150" font-family="monospace" font-size="18" fill="#93C5FD">;</text>

    <!-- cabelo de trás (longo, liso) -->
    <path d="M102 120 Q100 60 160 55 Q220 60 218 120 L226 270 Q190 290 160 288 Q130 290 94 270 Z" fill="url(#hair)"/>

    <!-- pescoço -->
    <rect x="146" y="168" width="28" height="30" rx="8" fill="#E8C1A8"/>

    <!-- camiseta branca -->
    <path d="M80 330 Q82 225 120 205 Q140 195 160 198 Q180 195 200 205 Q238 225 240 330 Z" fill="#F5F5F5"/>
    <path d="M140 199 Q160 214 180 199" fill="none" stroke="#DADADA" stroke-width="4"/>

    <!-- mechas da frente sobre os ombros -->
    <path d="M110 120 Q104 190 112 260 L128 262 Q122 190 128 130 Z" fill="url(#hair)"/>
    <path d="M210 120 Q216 190 208 260 L192 262 Q198 190 192 130 Z" fill="url(#hair)"/>

    <!-- rosto -->
    <ellipse cx="160" cy="132" rx="40" ry="48" fill="#F3D2BE"/>

    <!-- franja repartida no meio -->
    <path d="M160 72 Q124 74 118 120 Q120 150 124 160 Q128 112 160 86 Z" fill="url(#hair)"/>
    <path d="M160 72 Q196 74 202 120 Q200 150 196 160 Q192 112 160 86 Z" fill="url(#hair)"/>

    <!-- sobrancelhas -->
    <path d="M136 117 Q145 112 153 116" stroke="#2A1A14" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M167 116 Q175 112 184 117" stroke="#2A1A14" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- olhos -->
    <g class="blink">
      <ellipse cx="145" cy="131" rx="4" ry="5" fill="#3B2418"/>
      <ellipse cx="175" cy="131" rx="4" ry="5" fill="#3B2418"/>
      <circle cx="146.5" cy="129" r="1.3" fill="#fff"/>
      <circle cx="176.5" cy="129" r="1.3" fill="#fff"/>
    </g>

    <!-- óculos sem aro -->
    <rect x="130" y="121" width="28" height="20" rx="8" fill="#BFDBFE" fill-opacity=".18" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="162" y="121" width="28" height="20" rx="8" fill="#BFDBFE" fill-opacity=".18" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M158 128 L162 128" stroke="#CBD5E1" stroke-width="2"/>

    <!-- nariz, bochechas e boca -->
    <path d="M160 138 Q157 150 161 152" stroke="#D9A88E" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="137" cy="150" r="6" fill="#F4A7A0" opacity=".35"/>
    <circle cx="183" cy="150" r="6" fill="#F4A7A0" opacity=".35"/>
    <path d="M151 162 Q160 168 169 162" stroke="#B5645A" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- notebook -->
    <g transform="translate(0,18)">
    <path d="M92 252 L228 252 L240 300 L80 300 Z" fill="#0F2449" stroke="#4FC3F7" stroke-width="2"/>
    <rect x="96" y="232" width="128" height="22" rx="4" fill="url(#screen)"/>
    <text class="glow" x="160" y="285" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#4FC3F7">&lt;/&gt;</text>
    <rect x="70" y="298" width="180" height="10" rx="4" fill="#1E3A8A"/>
    </g>
  </g>
</svg>
